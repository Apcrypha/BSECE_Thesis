<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TalkBack Command Execution Logs</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      margin: 0;
      padding: 30px 20px;
      box-sizing: border-box;
    }

    .container {
      background-color: #ffffff;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 900px;
      text-align: center;
    }

    h1.title {
      font-size: 22px;
      color: #222222;
      margin-top: 0;
      margin-bottom: 20px;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .refresh-btn {
      padding: 9px 16px;
      font-size: 13px;
      font-weight: bold;
      color: #ffffff;
      background-color: #0d6efd;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .refresh-btn:hover {
      background-color: #0b5ed7;
    }

    .status-info {
      font-size: 13px;
      color: #666666;
    }

    /* Table Styling */
    .log-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    .log-table th, .log-table td {
      border: 1px solid #dddddd;
      padding: 10px 12px;
      font-size: 13px;
      text-align: center;
    }

    .log-table th {
      background-color: #343a40;
      color: #ffffff;
      font-weight: bold;
    }

    .log-table tr:nth-child(even) {
      background-color: #f8f9fa;
    }

    .log-table tr:hover {
      background-color: #e9ecef;
    }

    .cmd-cell {
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      color: #0d6efd;
    }

    .status-badge {
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: bold;
      display: inline-block;
    }

    .badge-executed {
      background-color: #d1e7dd;
      color: #0f5132;
    }

    .badge-pending {
      background-color: #fff3cd;
      color: #664d03;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1 class="title">TalkBack Command History & Execution Logs</h1>

    <div class="header-bar">
      <span id="statusMsg" class="status-info">Loading TalkBack records...</span>
      <button class="refresh-btn" onclick="fetchTalkBackLogs()">Refresh Logs</button>
    </div>

    <table class="log-table">
      <thead>
        <tr>
          <th>Command ID</th>
          <th>Command</th>
          <th>Time Queued / Sent</th>
          <th>Time Executed / Received</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="logTableBody">
        <tr>
          <td colspan="5">Fetching data from ThingSpeak TalkBack API...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <script>
    const TALKBACK_ID = "57954";
    const TALKBACK_API_KEY = "3R1GNZ8OKY0ZIXYI";

    // Auto-fetch logs on page load
    window.onload = function() {
      fetchTalkBackLogs();
    };

    function fetchTalkBackLogs() {
      const statusMsg = document.getElementById("statusMsg");
      const tableBody = document.getElementById("logTableBody");

      statusMsg.innerText = "Fetching TalkBack commands...";

      // ThingSpeak endpoint for full TalkBack command history
      const url = `https://api.thingspeak.com/talkbacks/${TALKBACK_ID}/commands.json?api_key=${TALKBACK_API_KEY}`;

      fetch(url)
        .then(response => {
          if (!response.ok) {
            throw new Error(`HTTP error! Status: ${response.status}`);
          }
          return response.json();
        })
        .then(commands => {
          if (!commands || !Array.isArray(commands) || commands.length === 0) {
            tableBody.innerHTML = `<tr><td colspan="5">No TalkBack commands found in history.</td></tr>`;
            statusMsg.innerText = "0 commands recorded.";
            return;
          }

          // Reverse array to put the most recent commands at the top
          const sortedCommands = commands.reverse();
          tableBody.innerHTML = "";

          sortedCommands.forEach(cmd => {
            const timeQueued = formatCustomDate(cmd.created_at);
            const timeExecuted = cmd.executed_at ? formatCustomDate(cmd.executed_at) : "--";
            const isExecuted = cmd.executed_at !== null && cmd.executed_at !== undefined;

            const statusBadge = isExecuted
              ? `<span class="status-badge badge-executed">Executed</span>`
              : `<span class="status-badge badge-pending">Queued (Pos: ${cmd.position || 1})</span>`;

            const row = document.createElement("tr");
            row.innerHTML = `
              <td>${cmd.id}</td>
              <td class="cmd-cell">${escapeHtml(cmd.command_string)}</td>
              <td>${timeQueued}</td>
              <td>${timeExecuted}</td>
              <td>${statusBadge}</td>
            `;
            tableBody.appendChild(row);
          });

          statusMsg.innerText = `Showing ${sortedCommands.length} command entries (Updated: ${new Date().toLocaleTimeString()})`;
        })
        .catch(err => {
          console.error("Error fetching TalkBack logs:", err);
          tableBody.innerHTML = `<tr><td colspan="5" style="color:red;">Failed to load TalkBack logs. Check API key or connection.</td></tr>`;
          statusMsg.innerText = "Error loading data.";
        });
    }

    // Format ISO Date string into MM-DD-YYYY HH:mm:ss
    function formatCustomDate(isoString) {
      if (!isoString) return "--";
      const date = new Date(isoString);

      const mm   = String(date.getMonth() + 1).padStart(2, '0');
      const dd   = String(date.getDate()).padStart(2, '0');
      const yyyy = date.getFullYear();
      const hh   = String(date.getHours()).padStart(2, '0');
      const min  = String(date.getMinutes()).padStart(2, '0');
      const ss   = String(date.getSeconds()).padStart(2, '0');

      return `${mm}-${dd}-${yyyy} ${hh}:${min}:${ss}`;
    }

    function escapeHtml(text) {
      return String(text || '')
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
