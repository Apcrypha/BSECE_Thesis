<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Audit Logs</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      margin: 0;
      padding: 30px 20px;
      box-sizing: border-box;
    }

    .container {
      background-color: #ffffff;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 800px;
      text-align: center;
    }

    h1.title {
      font-size: 22px;
      color: #222222;
      margin-top: 0;
      margin-bottom: 20px;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .refresh-btn {
      padding: 9px 16px;
      font-size: 13px;
      font-weight: bold;
      color: #ffffff;
      background-color: #0d6efd;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .refresh-btn:hover {
      background-color: #0b5ed7;
    }

    .status-info {
      font-size: 13px;
      color: #666666;
    }

    /* Table Styling */
    .log-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    .log-table th, .log-table td {
      border: 1px solid #dddddd;
      padding: 10px 12px;
      font-size: 13px;
      text-align: center;
    }

    .log-table th {
      background-color: #343a40;
      color: #ffffff;
      font-weight: bold;
    }

    .log-table tr:nth-child(even) {
      background-color: #f8f9fa;
    }

    .log-table tr:hover {
      background-color: #e9ecef;
    }

    .user-cell {
      font-weight: bold;
      color: #0d6efd;
    }

    .command-cell {
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      color: #212529;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1 class="title">System Activity & Command Audit Logs</h1>

    <div class="header-bar">
      <span id="statusMsg" class="status-info">Loading 50 latest entries...</span>
      <button class="refresh-btn" onclick="fetchAuditLogs()">Refresh Logs</button>
    </div>

    <table class="log-table">
      <thead>
        <tr>
          <th>Time(MM/DD/YYYY | HH:MM:SS)</th>
          <th>Admin User</th>
          <th>Command</th>
        </tr>
      </thead>
      <tbody id="logTableBody">
        <tr>
          <td colspan="3">Fetching data from ThingSpeak...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <script>
    const CHANNEL_ID = "3531224";
    const READ_API_KEY = "PEF4X55WVMKKWEDE";

    // Auto-fetch logs on page load
    window.onload = function() {
      fetchAuditLogs();
    };

    function fetchAuditLogs() {
      const statusMsg = document.getElementById("statusMsg");
      const tableBody = document.getElementById("logTableBody");

      statusMsg.innerText = "Fetching latest logs...";

      const url = `https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds.json?api_key=${READ_API_KEY}&results=50`;

      fetch(url)
        .then(response => {
          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }
          return response.json();
        })
        .then(data => {
          if (!data || !data.feeds || data.feeds.length === 0) {
            tableBody.innerHTML = `<tr><td colspan="3">No log records found on channel.</td></tr>`;
            statusMsg.innerText = "0 entries loaded.";
            return;
          }

          // Reverse array to place the most recent entries at the top
          const feeds = data.feeds.reverse();
          tableBody.innerHTML = "";

          feeds.forEach(feed => {
            const timeStr = formatCustomDate(feed.created_at);
            const userVal = feed.field1 ? escapeHtml(feed.field1) : "--";
            const cmdVal  = feed.field2 ? escapeHtml(feed.field2) : "--";

            const row = document.createElement("tr");
            row.innerHTML = `
              <td>${timeStr}</td>
              <td class="user-cell">${userVal}</td>
              <td class="command-cell">${cmdVal}</td>
            `;
            tableBody.appendChild(row);
          });

          statusMsg.innerText = `Showing latest ${feeds.length} entries (Updated: ${new Date().toLocaleTimeString()})`;
        })
        .catch(err => {
          console.error("Error fetching audit logs:", err);
          tableBody.innerHTML = `<tr><td colspan="3" style="color:red;">Failed to load logs. Check console or API key.</td></tr>`;
          statusMsg.innerText = "Error loading data.";
        });
    }

    // Format ISO Date string into MM-DD-YYYY-HH-MM-SS
    function formatCustomDate(isoString) {
      if (!isoString) return "--";
      const date = new Date(isoString);

      const mm   = String(date.getMonth() + 1).padStart(2, '0');
      const dd   = String(date.getDate()).padStart(2, '0');
      const yyyy = date.getFullYear();
      const hh   = String(date.getHours()).padStart(2, '0');
      const min  = String(date.getMinutes()).padStart(2, '0');
      const ss   = String(date.getSeconds()).padStart(2, '0');

      return `${mm}/${dd}/${yyyy} | ${hh}:${min}:${ss}`;
    }

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
